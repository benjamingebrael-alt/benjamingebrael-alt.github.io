<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Games – jogos grátis no navegador</title>
<meta name="description" content="School Games: jogos grátis para jogar direto no navegador, sem baixar nada. Jogue Turbo Ladder, corrida 3D com 50 pistas, loops e rampas.">
<meta property="og:title" content="School Games">
<meta property="og:description" content="Jogos grátis no navegador. Jogue Turbo Ladder, corrida 3D com 50 pistas.">
<meta property="og:image" content="turbo-ladder.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff5a1f'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='900'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="./"><span class="logo-mark" aria-hidden="true">▶</span><span>School Games</span></a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar jogos" aria-label="Buscar jogos">
    </label>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero" aria-label="Jogo em destaque"></section>

  <div class="section-head">
    <h2>Todos os jogos</h2>
    <div class="filters" id="filters" role="group" aria-label="Filtrar por categoria"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nenhum jogo encontrado.</p>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> School Games · Jogos grátis no navegador</span>
    <span>Feito com HTML, JavaScript e muita gasolina.</span>
  </div>
</footer>

<script src="games.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#year').textContent=new Date().getFullYear();

const f=GAMES.find(g=>g.featured)||GAMES[0];
$('#hero').innerHTML=`
  <a class="hero-media" href="play.html?game=${f.id}"><img src="${f.thumb}" alt="${esc(f.title)}"></a>
  <div class="hero-copy">
    <span class="eyebrow">Em destaque · ${esc(f.category)}</span>
    <h1>${esc(f.title)}</h1>
    <p>${esc(f.short)}</p>
    <div class="chips">${f.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
    <div class="btn-row"><a class="btn" href="play.html?game=${f.id}">▶ Jogar agora</a></div>
  </div>`;

const cats=['Todos',...new Set([...GAMES,...COMING_SOON].map(g=>g.category))];
let cat='Todos';
$('#filters').innerHTML=cats.map(c=>`<button type="button" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;
  document.querySelectorAll('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
$('#q').addEventListener('input',render);

function render(){
  const q=$('#q').value.trim().toLowerCase();
  const match=g=>(cat==='Todos'||g.category===cat)&&(!q||(g.title+' '+g.category+' '+(g.tags||[]).join(' ')+' '+(g.short||'')).toLowerCase().includes(q));
  const games=GAMES.filter(match);
  const soon=q?[]:COMING_SOON.filter(g=>cat==='Todos'||g.category===cat);
  $('#grid').innerHTML=games.map(g=>`
    <a class="card" href="play.html?game=${g.id}">
      ${g.isNew?'<span class="badge">Novo</span>':''}
      <div class="thumb"><img src="${g.thumb}" alt="" loading="lazy"></div>
      <div class="body"><h3>${esc(g.title)}</h3><p>${esc(g.category)} · ${esc(g.short)}</p></div>
    </a>`).join('')+soon.map(g=>`
    <div class="card soon" aria-label="Jogo em breve"><div class="thumb">?</div>
      <div class="body"><h3>${esc(g.title)}</h3><p>${esc(g.category)} · novo jogo a caminho</p></div></div>`).join('');
  $('#empty').hidden=games.length+soon.length>0;
}
render();
</script>
</body>
</html>
