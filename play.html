<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogar – School Games</title>
<meta name="description" content="Jogue grátis no navegador no School Games.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff5a1f'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='900'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="./"><span class="logo-mark" aria-hidden="true">▶</span><span>School Games</span></a>
    <a class="btn ghost" href="./" style="margin-left:auto;padding:10px 18px;font-size:1rem">← Todos os jogos</a>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> School Games · Jogos grátis no navegador</span>
    <span>Clique no jogo para usar o teclado.</span>
  </div>
</footer>

<script src="games.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#year').textContent=new Date().getFullYear();
const id=new URLSearchParams(location.search).get('game');
const g=GAMES.find(x=>x.id===id);
if(!g){
  $('#main').innerHTML=`<div class="panel" style="margin-top:24px"><h2>Jogo não encontrado</h2><p>Esse jogo não existe ou mudou de endereço.</p><p style="margin-top:14px"><a class="btn" href="./">Ver todos os jogos</a></p></div>`;
}else{
  document.title=`${g.title} – jogue grátis no School Games`;
  document.querySelector('meta[name=description]').content=`${g.title}: ${g.short} Jogue grátis no navegador, sem baixar nada.`;
  const others=GAMES.filter(x=>x.id!==g.id);
  $('#main').innerHTML=`
    <div class="player"><iframe id="frame" src="${g.path}" title="${esc(g.title)}" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></div>
    <div class="play-bar">
      <h1>${esc(g.title)}</h1>
      <div class="btn-row">
        <button class="btn" id="fs" type="button">⛶ Tela cheia</button>
        <a class="btn ghost" href="${g.path}" target="_blank" rel="noopener">Abrir em nova aba</a>
      </div>
    </div>
    <div class="info">
      <section class="panel"><h2>Sobre o jogo</h2><p>${esc(g.description)}</p>
        <div class="chips" style="margin-top:12px"><span class="chip">${esc(g.category)}</span>${g.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></section>
      <section class="panel"><h2>Controles</h2><ul class="keys">${g.controls.map(([k,a])=>`<li><span>${esc(a)}</span><kbd>${esc(k)}</kbd></li>`).join('')}</ul></section>
    </div>
    ${others.length?`<div class="section-head"><h2>Mais jogos</h2></div><div class="grid">${others.map(o=>`<a class="card" href="play.html?game=${o.id}"><div class="thumb"><img src="${o.thumb}" alt="" loading="lazy"></div><div class="body"><h3>${esc(o.title)}</h3><p>${esc(o.short)}</p></div></a>`).join('')}</div>`:''}`;
  const fr=$('#frame');
  fr.addEventListener('load',()=>fr.focus());
  $('#fs').addEventListener('click',()=>{const el=$('.player');(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);fr.focus();});
}
</script>
</body>
</html>
